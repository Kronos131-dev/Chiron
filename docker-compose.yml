services:
  # 1. LA BASE DE DONNÉES
  db:
    image: postgres:16-alpine
    container_name: chiron_postgres
    restart: always
    environment:
      POSTGRES_USER: chiron_user
      POSTGRES_PASSWORD: chiron_password
      POSTGRES_DB: chiron_db
    volumes:
      - chiron_pg_data:/var/lib/postgresql/data
    ports:
      - "5454:5432"

  # 2. LE BACKEND
  backend:
    image: eclipse-temurin:25-jre-alpine
    container_name: chiron_backend
    restart: always
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/chiron_db
      - SPRING_DATASOURCE_USERNAME=chiron_user
      - SPRING_DATASOURCE_PASSWORD=chiron_password
      # Olympus tourne dans son propre docker-compose. Les deux stacks rejoignent
      # le réseau Docker externe `chiron-olympus` pour communiquer directement
      # par nom de service.
      - OLYMPUS_BASE_URL=${OLYMPUS_BASE_URL:-http://olympus-api:8080}
      # Accès direct (lecture seule) à la base Olympus pour les graphes nutrition/poids.
      # ⚠️ Le service `olympus-db` doit rejoindre le réseau externe `chiron-olympus`
      # (côté docker-compose Olympus) pour être joignable par nom de service ici.
      - OLYMPUS_DB_URL=${OLYMPUS_DB_URL:-jdbc:postgresql://olympus-db:5432/olympus_db}
      - OLYMPUS_DB_USERNAME=${OLYMPUS_DB_USERNAME:-olympus_user}
      - OLYMPUS_DB_PASSWORD=${OLYMPUS_DB_PASSWORD:-olympus_password}
      # Dossier des photos de profil — pointé sur le volume persistant ci-dessous
      - UPLOADS_DIR=/app/uploads/images
    ports:
      - "9090:9090"
    volumes:
      - ./app.jar:/app/app.jar
      # Persiste les photos de profil hors du conteneur :
      # sans ce volume elles sont effacées à chaque recréation du conteneur.
      - ./uploads/images:/app/uploads/images
    command: ["java", "-jar", "/app/app.jar"]
    depends_on:
      - db
    networks:
      - default
      - chiron-olympus

  # 3. LE FRONTEND (Ton Nginx à toi)
  frontend:
    image: nginx:alpine
    container_name: chiron_frontend
    restart: always
    # J'ai supprimé l'ouverture des ports ici ! Il n'est plus accessible de l'extérieur.
    volumes:
      - ./dist/chiron-front/browser:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    # `default` : communication avec NPM. `chiron-olympus` : permet à ce nginx de
    # relayer /olympus/* vers le conteneur olympus-pwa par son nom de service.
    networks:
      - default
      - chiron-olympus

  # 4. NGINX PROXY MANAGER (Le "videur" qui gère le HTTPS)
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: chiron_npm
    restart: always
    ports:
      - "80:80"      # NPM intercepte le HTTP
      - "443:443"    # NPM intercepte le HTTPS
      - "81:81"      # Interface d'administration
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend

volumes:
  chiron_pg_data:

networks:
  chiron-olympus:
    external: true
    name: chiron-olympus