spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

langchain4j:
  mistral-ai:
    chat-model:
      api-key: test-key
      model-name: mistral-small-latest

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000

chiron:
  uploads-dir: /tmp/chiron-test-uploads

olympus:
  base-url: http://localhost:8080
  token-ttl-seconds: 86400

# Valeurs factices : FitbitClient/FitbitService ne font aucun appel réseau au
# chargement du contexte, ils ne font que stocker ces propriétés.
fitbit:
  client-id: test-client-id
  client-secret: test-client-secret
  redirect-uri: http://localhost:9090/api/fitbit/callback
  authorize-url: https://accounts.google.com/o/oauth2/v2/auth
  token-url: https://oauth2.googleapis.com/token
  api-base-url: https://health.googleapis.com
  scope: https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly
