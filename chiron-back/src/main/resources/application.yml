server:
  port: 9090
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: chiron
  datasource:
    url: jdbc:postgresql://127.0.0.1:5454/chiron_db
    username: chiron_user
    password: chiron_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  task:
    scheduling:
      pool:
        size: 4

  flyway:
    enabled: true
    # Tolère les migrations appliquées en base mais retirées du code (ex. V34/35/36,
    # supprimées alors qu'elles étaient déjà appliquées en prod). Sans ça, Flyway
    # échoue au démarrage : « Detected applied migration not resolved locally ».
    ignore-migration-patterns: "*:missing"

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

langchain4j:
  open-ai:
    chat-model:
      # WHY: OpenRouter parle le protocole d'OpenAI, d'où un client open-ai qui pointe
      # ailleurs. Le modèle est épinglé à sa version datée : les alias glissent d'une révision
      # à l'autre sans qu'aucun changement du dépôt ne l'explique, et tout le coach tient à une
      # seule capacité, l'appel d'outils. Se surcharge par CHIRON_AI_MODEL — la variable doit
      # être absente, pas vide : Spring n'applique le défaut que sur une propriété absente.
      api-key: ${OPENROUTER_API_KEY}
      base-url: ${CHIRON_AI_BASE_URL:https://openrouter.ai/api/v1}
      model-name: ${CHIRON_AI_MODEL:deepseek/deepseek-v4-flash-0731}

jwt:
  # Clé de signature HMAC, hexadécimale, 64 caractères minimum. Obligatoire :
  # sans JWT_SECRET l'application refuse de démarrer, plutôt que de signer les
  # jetons avec une clé de repli qui serait publique.
  secret: ${JWT_SECRET}
  # Expiration du token (ex: 2592000000ms = 30 jours)
  expiration: 2592000000

# Notifications push web (RFC 8291/8292). Sans VAPID_PUBLIC_KEY/VAPID_PRIVATE_KEY, une paire
# éphémère est générée au démarrage : les abonnements existants ne survivent pas à un
# redémarrage. Générer une vraie paire avec la commande décrite dans manage-env-and-secrets.
vapid:
  public-key: ${VAPID_PUBLIC_KEY:}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: ${VAPID_SUBJECT:mailto:contact@chiron-sanctuaire.fr}

chiron:
  uploads-dir: ${UPLOADS_DIR:./uploads/images}

  # WHY: interrupteur de Noctua, coupé. Sa veille tourne toutes les cinq minutes pour chaque
  # athlète lié, et chaque briefing est un appel au modèle : c'est, de loin, le premier poste
  # de consommation de l'IA, et il part sans que personne ne l'ait demandé. Coupé, la
  # synchronisation santé continue — seuls les briefings et leurs réponses s'arrêtent.
  noctua:
    ia-active: ${CHIRON_NOCTUA_IA:false}

  frontend-url: ${FRONTEND_URL:https://chiron-sanctuaire.fr}
  # Clé AES-256 base64 (32 octets) pour chiffrer les tokens externes (Olympus).
  # En dev : si vide, le service en génère une éphémère au boot (tokens perdus au redémarrage).
  # En prod : OBLIGATOIRE via env var CHIRON_SECRET_KEY.
  secret-key: ${CHIRON_SECRET_KEY:}

  # Import des rapports de composition corporelle Visbody (PDF reçus par email).
  # La boîte est relevée en IMAP en réutilisant le compte Gmail de spring.mail
  # (mêmes GMAIL_USERNAME / GMAIL_APP_PASSWORD). Désactivé par défaut.
  visbody:
    mailbox:
      enabled: ${VISBODY_MAILBOX_ENABLED:false}
      host: ${VISBODY_IMAP_HOST:imap.gmail.com}
      port: ${VISBODY_IMAP_PORT:993}
      username: ${GMAIL_USERNAME:}
      password: ${GMAIL_APP_PASSWORD:}
      folder: ${VISBODY_IMAP_FOLDER:INBOX}
      poll-interval-ms: ${VISBODY_POLL_INTERVAL_MS:300000}

olympus:
  base-url: ${OLYMPUS_BASE_URL:http://localhost:8080}
  # Durée de vie supposée du JWT Olympus (24h par défaut côté Olympus).
  token-ttl-seconds: ${OLYMPUS_TOKEN_TTL_SECONDS:86400}
  # Accès direct (lecture seule) à la base Olympus pour les graphes nutrition/poids
  # de la page Statistiques. Le pool tolère l'indisponibilité d'Olympus (mode dégradé).
  db:
    url: ${OLYMPUS_DB_URL:jdbc:postgresql://olympus-db:5432/olympus_db}
    username: ${OLYMPUS_DB_USERNAME:olympus_user}
    password: ${OLYMPUS_DB_PASSWORD:olympus_password}

# Intégration Fitbit (OAuth2 Authorization Code + PKCE).
# client-id / client-secret : à créer sur https://dev.fitbit.com/apps (type "Server").
# redirect-uri : doit correspondre EXACTEMENT à la Callback URL enregistrée chez Fitbit.
# Données santé Fitbit, exposées via la Google Health API (l'API Fitbit Web
# legacy est arrêtée en sept. 2026). client-id/secret viennent d'un projet
# Google Cloud (console Google Cloud), pas de dev.fitbit.com.
fitbit:
  client-id: ${FITBIT_CLIENT_ID:}
  client-secret: ${FITBIT_CLIENT_SECRET:}
  redirect-uri: ${FITBIT_REDIRECT_URI:http://localhost:9090/api/fitbit/callback}
  authorize-url: https://accounts.google.com/o/oauth2/v2/auth
  token-url: https://oauth2.googleapis.com/token
  api-base-url: https://health.googleapis.com
  scope: ${FITBIT_SCOPE:https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly https://www.googleapis.com/auth/googlehealth.sleep.readonly https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly https://www.googleapis.com/auth/googlehealth.activity_and_fitness.writeonly}

# Désactive la sonde de santé SMTP : sans creds Gmail en dev, MailHealthIndicator
# tente une connexion SMTP et pollue les logs avec une AuthenticationFailedException.
management:
  health:
    mail:
      enabled: false

# Debug temporaire — pour diagnostiquer 403 sur /api/nutrition/link.
logging:
  level:
    org.springframework.security: DEBUG
    com.kronos.chiron.security: DEBUG
    com.kronos.chiron.fitbit: DEBUG
