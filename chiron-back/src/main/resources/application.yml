server:
  port: 9090
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: chiron
  datasource:
    url: jdbc:postgresql://127.0.0.1:5454/chiron_db
    username: chiron_user
    password: chiron_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

langchain4j:
  mistral-ai:
    chat-model:
      api-key: ${MISTRAL_API_KEY}
      model-name: mistral-large-latest

jwt:
  # Expiration du token (ex: 2592000000ms = 30 jours)
  expiration: 2592000000

chiron:
  uploads-dir: ${UPLOADS_DIR:./uploads/images}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  # Clé AES-256 base64 (32 octets) pour chiffrer les tokens externes (Olympus).
  # En dev : si vide, le service en génère une éphémère au boot (tokens perdus au redémarrage).
  # En prod : OBLIGATOIRE via env var CHIRON_SECRET_KEY.
  secret-key: ${CHIRON_SECRET_KEY:}

olympus:
  base-url: ${OLYMPUS_BASE_URL:http://localhost:8080}
  # Durée de vie supposée du JWT Olympus (24h par défaut côté Olympus).
  token-ttl-seconds: ${OLYMPUS_TOKEN_TTL_SECONDS:86400}
  # Accès direct (lecture seule) à la base Olympus pour les graphes nutrition/poids
  # de la page Statistiques. Le pool tolère l'indisponibilité d'Olympus (mode dégradé).
  db:
    url: ${OLYMPUS_DB_URL:jdbc:postgresql://olympus-db:5432/olympus_db}
    username: ${OLYMPUS_DB_USERNAME:olympus_user}
    password: ${OLYMPUS_DB_PASSWORD:olympus_password}

# Intégration Fitbit (OAuth2 Authorization Code + PKCE).
# client-id / client-secret : à créer sur https://dev.fitbit.com/apps (type "Server").
# redirect-uri : doit correspondre EXACTEMENT à la Callback URL enregistrée chez Fitbit.
# Données santé Fitbit, exposées via la Google Health API (l'API Fitbit Web
# legacy est arrêtée en sept. 2026). client-id/secret viennent d'un projet
# Google Cloud (console Google Cloud), pas de dev.fitbit.com.
fitbit:
  client-id: ${FITBIT_CLIENT_ID:}
  client-secret: ${FITBIT_CLIENT_SECRET:}
  redirect-uri: ${FITBIT_REDIRECT_URI:http://localhost:9090/api/fitbit/callback}
  authorize-url: https://accounts.google.com/o/oauth2/v2/auth
  token-url: https://oauth2.googleapis.com/token
  api-base-url: https://health.googleapis.com
  scope: ${FITBIT_SCOPE:https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly https://www.googleapis.com/auth/googlehealth.sleep.readonly https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly}

# Désactive la sonde de santé SMTP : sans creds Gmail en dev, MailHealthIndicator
# tente une connexion SMTP et pollue les logs avec une AuthenticationFailedException.
management:
  health:
    mail:
      enabled: false

# Debug temporaire — pour diagnostiquer 403 sur /api/nutrition/link.
logging:
  level:
    org.springframework.security: DEBUG
    com.kronos.chiron.security: DEBUG
