server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Fichiers de contrôle du service worker : jamais figés, pour que l'application
    # installée détecte les nouvelles versions à chaque chargement.
    location = /ngsw.json            { add_header Cache-Control "no-cache"; }
    location = /ngsw-worker.js       { add_header Cache-Control "no-cache"; }
    location = /safety-worker.js     { add_header Cache-Control "no-cache"; }
    location = /worker-basic.min.js  { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location = /index.html           { add_header Cache-Control "no-cache"; }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
