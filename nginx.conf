server {
    listen 80;
    server_name localhost;

    # C'est ici que Nginx va chercher le site Angular (injecté via Docker).
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # --- Olympus PWA (ancien sous-chemin, conservé pour transition) ---
    # Olympus a désormais son propre sous-domaine (olympus.chiron-sanctuaire.fr).
    location = /olympus { return 308 /olympus/; }

    location /olympus/ {
        resolver 127.0.0.11 valid=30s;
        set $olympus_upstream http://olympus-pwa:80;
        proxy_pass $olympus_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        proxy_read_timeout 120s;
    }

    # --- Application Android ---
    # L'APK n'est pas servi depuis la racine web : deploy.yml y fait un `rsync --delete`, qui
    # l'effacerait à chaque déploiement. La redirection pointe sur la release GitHub du dernier
    # build signé — dépôt public, donc téléchargeable sans authentification depuis un téléphone.
    location = /apk {
        return 302 https://github.com/Kronos131-dev/Chiron/releases/latest/download/chiron.apk;
    }

    # --- Cache & mises à jour PWA ---
    # Fichiers de contrôle du service worker : jamais figés, pour que l'app installée
    # détecte les nouvelles versions à chaque chargement.
    location = /ngsw.json           { add_header Cache-Control "no-cache"; }
    location = /ngsw-worker.js      { add_header Cache-Control "no-cache"; }
    location = /safety-worker.js    { add_header Cache-Control "no-cache"; }
    location = /worker-basic.min.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location = /index.html          { add_header Cache-Control "no-cache"; }

    # Assets hashés Angular (main-XXXX.js, styles-XXXX.css, polices, images) : immuables.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # La règle Angular : si un fichier/dossier n'existe pas, renvoyer index.html (non figé).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
