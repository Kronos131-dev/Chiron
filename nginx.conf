server {
    listen 80;
    server_name localhost;

    # C'est ici que Nginx va chercher le site Angular (injecté via Docker).
    root /usr/share/nginx/html;
    index index.html;

    # --- Olympus PWA ---
    # Tout /olympus/* est relayé vers le conteneur olympus-pwa, qui sert la PWA
    # ET proxifie lui-même /olympus/api -> olympus-api (donc API en même origine).
    # On résout olympus-pwa via le DNS Docker (127.0.0.11) à la volée, et on passe
    # par une variable : ainsi nginx démarre même si olympus-pwa est temporairement
    # absent (502 à la requête plutôt qu'un crash au boot).
    location = /olympus { return 308 /olympus/; }

    location /olympus/ {
        resolver 127.0.0.11 valid=30s;
        set $olympus_upstream http://olympus-pwa:80;
        proxy_pass $olympus_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        proxy_read_timeout 120s;
    }

    # La règle Angular : si un fichier/dossier n'existe pas, renvoyer index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
