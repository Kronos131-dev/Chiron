name: Deploy Chiron

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Cible de déploiement'
        required: true
        default: 'production'
        type: choice
        options:
          - production

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  SERVER_HOST: 46.224.227.209
  DEPLOY_DIR: /opt/chiron
  # Force les actions JS (upload-artifact@v5, etc.) à tourner sur Node 24
  # plutôt que sur Node 20 — déprécié sur les runners GitHub depuis 09/2025.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Redirect URI OAuth Fitbit/Google Health. Non secrète (visible dans l'URL de
  # consentement). Doit correspondre EXACTEMENT à l'« Authorized redirect URI »
  # enregistrée dans la console Google Cloud.
  FITBIT_REDIRECT_URI: 'https://chiron-sanctuaire.duckdns.org/api/fitbit/callback'

jobs:

  # ── 1. Build backend ─────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Package JAR
        working-directory: chiron-back
        run: mvn package -DskipTests --no-transfer-progress

      # Le finalName dans pom.xml force le nom à app.jar
      - name: Vérification du JAR
        run: ls -lh chiron-back/target/app.jar

      - uses: actions/upload-artifact@v5
        with:
          name: backend-jar
          path: chiron-back/target/app.jar
          retention-days: 1

  # ── 2. Build frontend ─────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: chiron-front/package-lock.json

      - name: Install dependencies
        working-directory: chiron-front
        run: npm ci

      - name: Build production
        working-directory: chiron-front
        run: npm run build -- --configuration production

      - name: Vérification du build
        run: |
          echo "Contenu de dist/ :"
          find chiron-front/dist -type f | head -20

      # Angular 17+ avec @angular/build:application → dist/chiron-front/browser/
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: chiron-front/dist/chiron-front/browser/
          retention-days: 1

  # ── 3a. Unit tests ───────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run unit tests (Surefire)
        working-directory: chiron-back
        run: mvn test --no-transfer-progress

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results
          path: chiron-back/target/surefire-reports/
          retention-days: 7

  # ── 3b. Integration tests ────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run integration tests (Failsafe)
        working-directory: chiron-back
        run: mvn verify -DskipUTs=true --no-transfer-progress

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-test-results
          path: chiron-back/target/failsafe-reports/
          retention-days: 7

  # ── 4. Deploy SSH ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy → ${{ inputs.target }}
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    environment: ${{ inputs.target || 'production' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: backend-jar
          path: artifacts/

      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: artifacts/frontend/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Upload JAR
        run: |
          scp -i ~/.ssh/deploy_key \
            artifacts/app.jar \
            ${{ secrets.SSH_USER }}@${{ env.SERVER_HOST }}:/tmp/chiron-app.jar

      - name: Upload frontend
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            artifacts/frontend/ \
            ${{ secrets.SSH_USER }}@${{ env.SERVER_HOST }}:/tmp/chiron-frontend/

      - name: Upload docker-compose.yml
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.yml \
            ${{ secrets.SSH_USER }}@${{ env.SERVER_HOST }}:/tmp/chiron-docker-compose.yml

      - name: Upload secrets
        run: |
          printf 'GMAIL_USERNAME=%s\nGMAIL_APP_PASSWORD=%s\nFRONTEND_URL=%s\nFITBIT_CLIENT_ID=%s\nFITBIT_CLIENT_SECRET=%s\nFITBIT_REDIRECT_URI=%s\nOLYMPUS_DB_URL=%s\nOLYMPUS_DB_USERNAME=%s\nOLYMPUS_DB_PASSWORD=%s\nVISBODY_MAILBOX_ENABLED=%s\n' \
            '${{ secrets.GMAIL_USERNAME }}' \
            '${{ secrets.GMAIL_APP_PASSWORD }}' \
            '${{ secrets.FRONTEND_URL }}' \
            '${{ secrets.FITBIT_CLIENT_ID }}' \
            '${{ secrets.FITBIT_CLIENT_SECRET }}' \
            '${{ env.FITBIT_REDIRECT_URI }}' \
            '${{ secrets.OLYMPUS_DB_URL }}' \
            '${{ secrets.OLYMPUS_DB_USERNAME }}' \
            '${{ secrets.OLYMPUS_DB_PASSWORD }}' \
            '${{ secrets.VISBODY_MAILBOX_ENABLED }}' \
            > /tmp/chiron.secrets
          scp -i ~/.ssh/deploy_key /tmp/chiron.secrets \
            ${{ secrets.SSH_USER }}@${{ env.SERVER_HOST }}:/tmp/chiron.secrets

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.SSH_USER }}@${{ env.SERVER_HOST }} \
            'bash -s' << 'ENDSSH'

            set -e
            DEPLOY_DIR=/opt/chiron
            CHIRON_DIR=~/chiron

            # docker-compose (v1) ou docker compose (v2)
            if command -v docker-compose &> /dev/null; then COMPOSE="docker-compose"; else COMPOSE="docker compose"; fi

            echo "▶ Arrêt et suppression du backend..."
            docker stop chiron_backend || true
            docker rm chiron_backend || true

            echo "▶ Mise à jour du JAR (DEPLOY_DIR = archive, CHIRON_DIR = mount docker-compose)..."
            sudo cp /tmp/chiron-app.jar $DEPLOY_DIR/app.jar
            cp /tmp/chiron-app.jar $CHIRON_DIR/app.jar

            echo "▶ Mise à jour du frontend (DEPLOY_DIR + chemin réellement monté par docker-compose)..."
            sudo rsync -a --delete /tmp/chiron-frontend/ $DEPLOY_DIR/frontend/
            mkdir -p $CHIRON_DIR/dist/chiron-front/browser
            rsync -a --delete /tmp/chiron-frontend/ $CHIRON_DIR/dist/chiron-front/browser/

            echo "▶ Mise à jour du docker-compose.yml..."
            cp /tmp/chiron-docker-compose.yml $CHIRON_DIR/docker-compose.yml

            echo "▶ Mise à jour du .env..."
            ENV_FILE=$CHIRON_DIR/.env
            grep -v '^GMAIL_\|^FRONTEND_URL=\|^FITBIT_\|^OLYMPUS_DB_\|^VISBODY_MAILBOX_ENABLED=' "$ENV_FILE" > /tmp/.env.tmp 2>/dev/null || true
            cat /tmp/chiron.secrets >> /tmp/.env.tmp
            mv /tmp/.env.tmp "$ENV_FILE"

            echo "▶ Vérification du réseau partagé chiron-olympus..."
            docker network inspect chiron-olympus >/dev/null 2>&1 \
              || docker network create chiron-olympus

            echo "▶ Recréation des conteneurs backend + frontend..."
            cd $CHIRON_DIR
            if ! $COMPOSE up -d --force-recreate backend frontend; then
              echo "✗ ÉCHEC : '$COMPOSE up' n'a pas pu démarrer les conteneurs."
              docker ps -a
              echo "--- qui occupe le port 9090 ---"
              sudo ss -ltnp 2>/dev/null | grep ':9090' || true
              echo "--- service systemd chiron-back (concurrent éventuel) ---"
              systemctl is-active chiron-back 2>/dev/null || echo "absent/inactif"
              exit 1
            fi

            echo "▶ Vérification : le conteneur tourne bien le JAR qu'on vient de déployer..."
            sleep 3
            EXPECTED_SHA=$(sha256sum /tmp/chiron-app.jar | awk '{print $1}')
            RUNNING_SHA=$(docker exec chiron_backend sha256sum /app/app.jar 2>/dev/null | awk '{print $1}' || echo "indisponible")
            if [ "$EXPECTED_SHA" != "$RUNNING_SHA" ]; then
              echo "✗ ÉCHEC : le conteneur backend ne tourne PAS le JAR déployé."
              echo "  attendu   = $EXPECTED_SHA"
              echo "  conteneur = $RUNNING_SHA"
              echo "--- qui occupe le port 9090 ---"
              sudo ss -ltnp 2>/dev/null | grep ':9090' || true
              echo "--- service systemd chiron-back (concurrent éventuel) ---"
              systemctl is-active chiron-back 2>/dev/null || echo "absent/inactif"
              docker logs --tail 30 chiron_backend 2>&1 || true
              exit 1
            fi
            echo "✓ Conteneur backend aligné sur le JAR déployé."

            echo "▶ Nettoyage..."
            rm -f /tmp/chiron-app.jar /tmp/chiron.secrets /tmp/.env.tmp /tmp/chiron-docker-compose.yml
            rm -rf /tmp/chiron-frontend/

            echo "✓ Déploiement terminé"
          ENDSSH

      - name: Health check
        run: |
          HEALTH_URL="http://${{ env.SERVER_HOST }}:9090/actuator/health"
          echo "Attente du démarrage du backend (max 120s) sur $HEALTH_URL"
          STATUS=000
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Backend UP — HTTP 200 après ~$((i * 5))s"
              exit 0
            fi
            echo "  tentative $i/24 : HTTP $STATUS — nouvelle tentative dans 5s..."
            sleep 5
          done
          echo "✗ ÉCHEC : /actuator/health ne renvoie pas 200 (dernier code : HTTP $STATUS)."
          echo "  HTTP 403 ici = le backend actif n'est pas le nouveau code (ancien JAR encore en mémoire)."
          echo "  HTTP 000 ici = rien n'écoute sur 9090 (le backend a planté au démarrage)."
          exit 1

      # Sur échec : récupère les logs du conteneur backend (cause réelle du crash).
      - name: Diagnostics backend (si échec)
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.SSH_USER }}@${{ env.SERVER_HOST }} 'bash -s' << 'ENDSSH'
            echo "=== docker ps -a ==="
            docker ps -a || true
            echo "=== docker logs chiron_backend (200 dernières lignes) ==="
            docker logs --tail 200 chiron_backend 2>&1 || true
          ENDSSH
