<app-header [title]="'aptitude.title' | t"></app-header>

<main class="min-h-screen pt-24 pb-32 heroic-texture px-4 md:px-8">
  <div class="max-w-4xl mx-auto">
    @if (loading()) {
      <div class="flex justify-center mt-16">
        <span
          class="w-12 h-12 border-4 border-secondary/20 border-t-secondary rounded-full animate-spin"
        ></span>
      </div>
    } @else {
      <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-slate-900/40 border border-white/5 rounded-xl p-5">
          <p class="text-[10px] font-bold tracking-[0.2em] uppercase text-on-surface-variant mb-1">
            {{ 'aptitude.vo2max' | t }}
          </p>
          <p class="text-3xl font-black text-white">
            {{ dernierVo2Max() != null ? (dernierVo2Max() | number: '1.0-1') : '—' }}
          </p>
        </div>
        <div class="bg-slate-900/40 border border-white/5 rounded-xl p-5">
          <p class="text-[10px] font-bold tracking-[0.2em] uppercase text-on-surface-variant mb-1">
            {{ 'aptitude.level' | t }}
          </p>
          <p class="text-2xl font-black text-secondary">{{ dernierNiveau() ?? '—' }}</p>
        </div>
      </div>

      <div class="bg-slate-900/40 border border-white/5 rounded-xl p-4">
        <h3 class="text-sm font-bold uppercase tracking-widest text-on-surface-variant mb-2">
          {{ 'aptitude.evolution' | t }}
        </h3>
        @if (points().length === 0) {
          <p class="text-center text-on-surface-variant py-16">{{ 'common.noData' | t }}</p>
        } @else {
          <div class="h-64">
            <canvas baseChart [data]="chart()" [options]="options" type="line"></canvas>
          </div>
        }
      </div>
    }
  </div>
</main>
