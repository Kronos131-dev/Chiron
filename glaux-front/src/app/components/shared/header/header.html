<header
  class="bg-slate-950/80 backdrop-blur-md flex items-center justify-between px-6 py-4 w-full fixed top-0 z-50 border-b border-secondary/10"
>
  <div class="flex items-center gap-3">
    <img src="icons/icon-96x96.png?v=2" alt="" width="32" height="32" class="shrink-0" />
    <h1 class="text-2xl font-black text-[#f0fdfa] tracking-widest font-headline uppercase">
      {{ title }}
    </h1>
  </div>

  <div class="relative">
    <button
      (click)="toggleMenu()"
      aria-label="Menu"
      [attr.aria-expanded]="showMenu()"
      class="material-symbols-outlined transition-colors duration-200 cursor-pointer hover:text-secondary"
      [ngClass]="showMenu() ? 'text-secondary' : 'text-[#f0fdfa]'"
    >
      {{ showMenu() ? 'close' : 'menu' }}
    </button>

    @if (showMenu()) {
      <div
        class="absolute right-0 mt-2 w-52 bg-slate-900 border border-secondary/20 rounded-xl shadow-2xl py-2 z-50"
      >
        <a
          [href]="chironUrl"
          class="flex items-center gap-3 px-4 py-3 text-sm text-on-surface hover:bg-white/5 transition-colors"
        >
          <span class="material-symbols-outlined text-sm text-secondary">account_balance</span>
          {{ 'nav.chiron' | t }}
        </a>
        <div class="border-t border-white/5 mt-1 pt-1">
          <button
            (click)="logout()"
            class="w-full flex items-center gap-3 px-4 py-3 text-sm text-red-400 hover:bg-red-500/10 transition-colors cursor-pointer"
          >
            <span class="material-symbols-outlined text-sm">logout</span> {{ 'nav.logout' | t }}
          </button>
        </div>
      </div>
    }
  </div>
</header>

<nav
  class="fixed bottom-0 w-full bg-slate-950/95 backdrop-blur-md border-t border-secondary/20 pb-2 z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]"
>
  <div class="flex justify-around items-center p-3 max-w-lg mx-auto">
    <a
      routerLink="/noctua"
      routerLinkActive="text-secondary"
      class="relative flex flex-col items-center gap-1 text-slate-500 hover:text-secondary/80 transition-colors"
    >
      @if (noctuaNotifications.nonLus() > 0) {
        <span class="absolute -top-0.5 right-1 w-2 h-2 rounded-full bg-secondary"></span>
      }
      <span class="material-symbols-outlined text-2xl">nights_stay</span>
      <span class="text-[9px] font-bold uppercase tracking-widest">{{ 'nav.noctua' | t }}</span>
    </a>
    <a
      routerLink="/"
      routerLinkActive="text-secondary"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex flex-col items-center gap-1 text-slate-500 hover:text-secondary/80 transition-colors"
    >
      <span class="material-symbols-outlined text-2xl">today</span>
      <span class="text-[9px] font-bold uppercase tracking-widest">{{ 'nav.today' | t }}</span>
    </a>
    <a
      routerLink="/coeur"
      routerLinkActive="text-secondary"
      class="flex flex-col items-center gap-1 text-slate-500 hover:text-secondary/80 transition-colors"
    >
      <span class="material-symbols-outlined text-2xl">favorite</span>
      <span class="text-[9px] font-bold uppercase tracking-widest">{{ 'nav.coeur' | t }}</span>
    </a>
    <a
      routerLink="/sommeil"
      routerLinkActive="text-secondary"
      class="flex flex-col items-center gap-1 text-slate-500 hover:text-secondary/80 transition-colors"
    >
      <span class="material-symbols-outlined text-2xl">bedtime</span>
      <span class="text-[9px] font-bold uppercase tracking-widest">{{ 'nav.sommeil' | t }}</span>
    </a>
    <a
      routerLink="/activite"
      routerLinkActive="text-secondary"
      class="flex flex-col items-center gap-1 text-slate-500 hover:text-secondary/80 transition-colors"
    >
      <span class="material-symbols-outlined text-2xl">directions_walk</span>
      <span class="text-[9px] font-bold uppercase tracking-widest">{{ 'nav.activite' | t }}</span>
    </a>
  </div>
</nav>
