<router-outlet></router-outlet>

@if (showNav()) {
  <nav
    class="fixed bottom-0 w-full bg-slate-950/95 backdrop-blur-md border-t border-secondary/20 pb-2 z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]"
  >
    <div class="flex justify-around items-center p-4 max-w-lg mx-auto">
      <!-- WHY: la classe active est appliquée par liaison et non par `routerLinkActive`.
           Ajoutée comme classe supplémentaire, `text-secondary` se retrouvait en concurrence
           de spécificité égale avec la couleur de repos, et c'est l'ordre de la feuille de
           style qui tranchait — d'où un seul onglet sur sept qui s'allumait. -->
      @for (onglet of onglets; track onglet.chemin) {
        <a
          [routerLink]="onglet.chemin"
          routerLinkActive
          #actif="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: onglet.exact }"
          class="flex flex-col items-center gap-1 transition-colors active:scale-95"
          [class.text-secondary]="actif.isActive"
          [class.text-slate-500]="!actif.isActive"
        >
          @if (onglet.emoji) {
            <span class="text-2xl leading-none">{{ onglet.icone }}</span>
          } @else {
            <span class="material-symbols-outlined text-2xl leading-none">{{ onglet.icone }}</span>
          }
          <span class="text-[9px] font-bold uppercase tracking-[0.2em]">{{ onglet.cle | t }}</span>
        </a>
      }
    </div>
  </nav>
}
