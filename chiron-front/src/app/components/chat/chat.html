<!-- Top Navigation Header via Shared Component -->
<app-header [title]="'CHIRON'" [showBack]="false" [showInfo]="true"></app-header>

<div class="chat-shell heroic-texture">

  <!-- Fil de discussion -->
  <main class="chat-stream" #scrollContainer>
    <div class="chat-stream-inner">

      <!-- Messages -->
      <div class="msg-list">
        @for (msg of messages(); track $index) {
          <div class="msg-row"
               [class.msg-user]="msg.role === 'user'"
               [class.msg-ai]="msg.role === 'ai'">
            @if (msg.role === 'ai') {
              <div class="msg-avatar">
                <span class="material-symbols-outlined">neurology</span>
              </div>
            }
            <div class="msg-bubble">
              @if (msg.role === 'ai') {
                <div class="msg-content markdown-body" [innerHTML]="msg.content | markdown"></div>
              } @else {
                <div class="msg-content">{{ msg.content }}</div>
              }
            </div>
          </div>
        }

        <!-- Indicateur « Chiron réfléchit… » -->
        @if (isLoading()) {
          <div class="msg-row msg-ai">
            <div class="msg-avatar">
              <span class="material-symbols-outlined">neurology</span>
            </div>
            <div class="msg-bubble typing-bubble">
              <div class="typing-dots"><span></span><span></span><span></span></div>
              <span class="typing-text">Chiron réfléchit…</span>
            </div>
          </div>
        }
      </div>

    </div>
  </main>

  <!-- Zone de saisie -->
  <footer class="chat-composer">
    <div class="composer-inner">
      <button
        type="button"
        class="composer-mic"
        [class.recording]="isRecording()"
        (click)="toggleRecording()"
        [disabled]="isLoading()"
        aria-label="Dicter">
        <span class="material-symbols-outlined">{{ isRecording() ? 'stop_circle' : 'mic' }}</span>
      </button>

      <input
        class="composer-input"
        [ngModel]="userInput()"
        (ngModelChange)="userInput.set($event)"
        (keyup.enter)="onSend()"
        placeholder="Parle à Chiron…"
        type="text"
        [disabled]="isLoading()" />

      <button
        type="button"
        class="composer-send"
        (click)="onSend()"
        [disabled]="isLoading() || !userInput().trim()"
        aria-label="Envoyer">
        <span class="material-symbols-outlined">arrow_upward</span>
      </button>
    </div>
  </footer>
</div>
