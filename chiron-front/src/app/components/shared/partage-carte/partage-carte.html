<div
  class="fixed inset-0 z-[60] flex flex-col bg-slate-950/95 backdrop-blur-md pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)]"
>
  <div class="flex items-center justify-between px-4 py-3">
    <h2 class="font-headline font-black text-lg tracking-widest uppercase text-secondary">
      {{ 'share.title' | t }}
    </h2>
    <button
      (click)="fermer.emit()"
      type="button"
      [attr.aria-label]="'share.close' | t"
      class="w-10 h-10 grid place-items-center rounded-full bg-white/5 text-on-surface-variant hover:text-white hover:bg-white/10 transition-colors cursor-pointer"
    >
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <div class="flex-1 min-h-0 flex items-center justify-center px-4 py-2">
    @switch (etat()) {
      @case ('pret') {
        <img
          [src]="apercu()"
          [alt]="carte.titre"
          class="max-h-full max-w-full rounded-2xl border border-secondary/20 shadow-2xl shadow-black/60 object-contain"
        />
      }
      @case ('erreur') {
        <p class="text-red-400 text-sm text-center">{{ 'share.error' | t }}</p>
      }
      @default {
        <div class="flex flex-col items-center gap-3 text-on-surface-variant">
          <div
            class="w-10 h-10 border-4 border-secondary/30 border-t-secondary rounded-full animate-spin"
          ></div>
          <p class="text-xs font-bold tracking-widest uppercase">{{ 'share.forging' | t }}</p>
        </div>
      }
    }
  </div>

  <div class="px-4 pt-3 pb-4 space-y-3 max-w-md w-full mx-auto">
    <div class="grid grid-cols-2 gap-2">
      @for (nom of formats; track nom) {
        <button
          (click)="changerFormat(nom)"
          type="button"
          [class]="
            format() === nom
              ? 'bg-secondary/15 text-secondary border-secondary/50'
              : 'bg-white/5 text-on-surface-variant border-white/10'
          "
          class="py-2 rounded-lg border text-xs font-bold tracking-widest uppercase transition-colors cursor-pointer"
        >
          {{ 'share.format.' + nom | t }}
        </button>
      }
    </div>

    @if (message()) {
      <p class="text-secondary text-xs font-bold tracking-widest uppercase text-center">
        {{ message() }}
      </p>
    }

    <button
      (click)="partager()"
      [disabled]="etat() !== 'pret'"
      type="button"
      class="w-full bg-gradient-to-r from-secondary to-[#c77a30] text-slate-950 font-black text-sm px-6 py-4 rounded-xl uppercase tracking-widest active:scale-95 transition-transform shadow-lg shadow-secondary/20 flex items-center justify-center gap-2 disabled:opacity-40 cursor-pointer"
    >
      <span class="material-symbols-outlined text-lg">ios_share</span>
      {{ 'share.action' | t }}
    </button>
  </div>
</div>
