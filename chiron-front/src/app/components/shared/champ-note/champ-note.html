<div class="flex items-center justify-between gap-2 min-h-9">
  <span class="text-secondary text-[9px] font-bold tracking-[0.2em] uppercase ml-1">{{
    libelle()
  }}</span>
  @if (valeur()) {
    <button
      type="button"
      (click)="effacer()"
      class="inline-flex items-center gap-1 px-3 py-2 rounded border border-white/10 text-on-surface-variant text-[9px] font-bold tracking-[0.15em] uppercase hover:text-red-400 hover:border-red-400/30 transition-colors"
    >
      <span class="material-symbols-outlined text-sm leading-none">backspace</span>
      {{ 'common.clear' | t }}
    </button>
  }
</div>
<textarea
  [value]="valeur() ?? ''"
  (input)="saisir($event)"
  rows="2"
  [attr.aria-label]="libelle()"
  [placeholder]="indication()"
  class="w-full mt-1 bg-slate-950/50 border border-white/10 rounded p-3 text-white font-body text-sm outline-none focus:border-secondary/50 transition-colors resize-y"
></textarea>
